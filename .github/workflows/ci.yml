name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Em dash check
        run: python3 -c 'import pathlib,sys; ch="\u2014"; bad=[str(p) for p in pathlib.Path(".").rglob("*") if p.is_file() and p.suffix in (".md",".py") and ".git/" not in str(p) and ch in p.read_text(errors="ignore")]; print("em dash in:", bad); sys.exit(1 if bad else 0)'
      - name: Run tests
        run: python -m pytest -q
